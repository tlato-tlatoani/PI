<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estadisticas.css">
    <title>Estadísticas</title>
</head>
<body>
    <header>
        <h1>MexScan</h1>
        <button id="help-btn">?</button>
    </header>

    <div class="secciones">
        <a href="index.html">

            <button class="seccion">
                <img src="/assets/iconos/cube.png" alt="icono-ra" width="20" height="20" class="icono">
                <span class="btn-text">Realidad Aumentada</span>
            </button>
        </a>

        <a href="edicion-video.html">

            <button class="seccion">
                <img src="/assets/iconos/video-camera.png" alt="icono-edicion-video" width="20" height="20"

            </button>
        </a>

        <a href="estadisticas.html">
