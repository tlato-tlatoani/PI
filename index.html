<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/realidad-aumentada.css">

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>

    <!-- MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.4/dist/mindar-image-aframe.prod.js"></script>

    <!-- Luego extras -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <!-- Partículas -->
    <script
        src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>

    <title>Realidad Aumentada</title>
</head>

<body>
    <header>
        <h1>MexScan</h1>
        <button id="help-btn">?</button>
    </header>

    <div class="secciones">
        <a href="realidad-aumentada.html">

            <button class="seccion">
                <img src="../assets/iconos/cube.png" alt="icono-ra" width="20" height="20" class="icono">
                <span class="btn-text">Realidad Aumentada</span>
            </button>
        </a>

        <a href="edicion-video.html">

            <button class="seccion">
                <img src="../assets/iconos/video-camera.png" alt="icono-edicion-video" width="20" height="20"
                    class="icono">
                <span class="btn-text">Edición de video</span>
            </button>
        </a>

    </div>


    <div class="escaneado">
        <div class="camera-container">

            <a-scene mindar-image="imageTargetSrc: /targets.mind; autoStart: true; maxTrack: 1;" embedded
                renderer="alpha: true" color-space="sRGB" vr-mode-ui="enabled: false"
                device-orientation-permission-ui="enabled: false">

                <!-- Pre-cargar los modelos -->
                <a-assets> <a-asset-item id="mexicoModel" src="./assets/modelos/pinata.glb"></a-asset-item> </a-assets>
                <a-assets> <a-asset-item id="sudafricaModel" src="./assets/modelos/elephant.glb"></a-asset-item> </a-assets>
                <a-assets> <a-asset-item id="espanaModel" src="./assets/modelos/guitarra.glb"></a-asset-item> </a-assets>
                <a-assets> <a-asset-item id="japonModel" src="./assets/modelos/cherry-tree.glb"></a-asset-item> </a-assets>
                <a-assets> <a-asset-item id="coreaModel" src="./assets/modelos/moranhwa.glb"></a-asset-item> </a-assets>
                <a-assets> <a-asset-item id="colombiaModel" src="./assets/modelos/cafe.glb"></a-asset-item> </a-assets>
                <a-assets> <a-asset-item id="tunezModel" src="./assets/modelos/camello.glb"></a-asset-item> </a-assets>
                <a-assets> <a-asset-item id="uzbekistanModel" src="./assets/modelos/pan.glb"></a-asset-item> </a-assets>
                <a-assets> <a-asset-item id="uruguayModel" src="./assets/modelos/mate.glb"></a-asset-item> </a-assets>

                <!-- Camara-->
                <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

                <!-- Targets -->
                <a-entity data-clave="espana" mindar-image-target="targetIndex: 0"> <!--españa-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

                <a-entity data-clave="corea_del_sur" mindar-image-target="targetIndex: 1"> <!--corea-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

                <a-entity data-clave="japon" mindar-image-target="targetIndex: 2"> <!--japon-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

                <a-entity data-clave="uzbekistan" mindar-image-target="targetIndex: 3"> <!--uzbekistan-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

                <a-entity data-clave="mexico" mindar-image-target="targetIndex: 4"> <!--mexico-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

                <a-entity data-clave="tunez" mindar-image-target="targetIndex: 5"> <!--tunez-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

                <a-entity data-clave="uruguay" mindar-image-target="targetIndex: 6"> <!--uruguay-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

                <a-entity data-clave="sudafrica" mindar-image-target="targetIndex: 7"> <!--sudafrica-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

                <a-entity data-clave="colombia" mindar-image-target="targetIndex: 8"> <!--colombia-->
                    <a-entity class="modelo-container"></a-entity>
                </a-entity>

            </a-scene>

            <button id="play-btn" class="play-animation hidden">▶</button>
        </div>

        <div id="info-card" class="card hidden">
            <button id="close-card" class="close-btn">✕</button>

            <div id="card-content">

                <!-- INFORMACIÓN -->
                <div id="info-view">

                    <h2 id="card-nombre"></h2>
                    <p id="card-descripcion"></p>

                    <hr>

                    <p><strong>Mejores resultados:</strong></p>

                    <table>
                        <thead>
                            <tr>
                                <th>Año</th>
                                <th>Mundial</th>
                                <th>Instancia</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-resultados"></tbody>
                    </table>

                    <button id="trivia-btn">Trivia</button>
                </div>


                <!-- TRIVIA -->
                <div id="trivia-view" class="hidden">
                </div>

            </div>
        </div>

    </div>

    <script src="js/realidad-aumentada.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>




</body>



</html>
