<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/realidad-aumentada.css">

    <title>Realidad Aumentada</title>
</head>

<body>
    <header>
        <h1>MexScan</h1>
        <button id="help-btn">?</button>
    </header>

    <div class="secciones">
        <a href="realidad-aumentada.html">

            <button class="seccion">
                <img src="../assets/iconos/cube.png" alt="icono-ra" width="20" height="20" class="icono">
                <span class="btn-text">Realidad Aumentada</span>
            </button>
        </a>

        <a href="edicion-video.html">

            <button class="seccion">
                <img src="../assets/iconos/video-camera.png" alt="icono-edicion-video" width="20" height="20" class="icono">
                <span class="btn-text">Edición de video</span>
            </button>
        </a>
        <!--
        <a href="estadisticas.html">
            <button>
                <img src="../assets/iconos/bar-chart-line.svg" alt="icono-estadisticas" width="20" height="20">
                Estadisticas</button>
        </a>
        -->

    </div>


    <div class="escaneado">
        <div class="camera-container">
            <video id="camera" autoplay playsinline></video>
            <canvas id="photo" hidden></canvas>

            <button id="capture">

                <img src="../assets/iconos/camera.svg" alt="icono-camara" width="32" height="32">

            </button>
        </div>

        <div id="info-card" class="card hidden">
            <button id="close-card" class="close-btn">✕</button>

            <div id="card-content">
                <h2>Imagen escaneada</h2>
                <p>Información del país...</p>
                <hr>
                <p>Participaciones anteriores:</p>
                <table>
                    <tr>
                        <th>Año</th>
                        <th>Mundial</th>
                        <th>Instancia</th>
                    </tr>
                    <tr>
                        <td>2010</td>
                        <td>Sudafrica</td>
                        <td>Cuartos de final</td>
                    </tr>
                    <tr>
                        <td>2022</td>
                        <td>Qatar</td>
                        <td>Semifinal</td>
                    </tr>
                </table>
                <button id="trivia-btn">Trivia</button>
            </div>
        </div>

    </div>

    <script src="js/realidad-aumentada.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


</body>



</html>
